name: Supabase keep alive

on:
  schedule:
    # GitHub Actions cron uses UTC. Run three lightweight database reads per day.
    - cron: "17 6,14,22 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Supabase database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -eu
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Add SUPABASE_URL and SUPABASE_ANON_KEY in the repository's Actions secrets."
            exit 1
          fi

          curl --fail --silent --show-error \
            --retry 2 --retry-all-errors --max-time 20 \
            "${SUPABASE_URL%/}/rest/v1/manufacturers?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Accept: application/json" \
            --output /dev/null
